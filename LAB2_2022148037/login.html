<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- 외부 CSS 참조 코드 -->
    <link rel="stylesheet" type="text/css" href="main.css">
</head>
<body>
    <h1>Welcome to INTERNET-PROGRAMMING MOVIE SITE</h1>
    
    <div class="header-links">
        <a href="login.html">로그인</a> | <a href="signup.html">회원가입</a>
    </div>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label class="title-label">아이디 :</label>
                <input type="text" name="userid" placeholder="아이디 입력" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="title-label">비밀번호 :</label>
                <input type="password" name="pwd" placeholder="비밀번호 입력" required>
            </div>
            
            <div class="btn-group">
                <button type="submit" class="btn-submit">Login</button>
                <button type="reset" class="btn-cancel">Cancel</button>
            </div>
        </form>
    </div>
</body>
</html>
