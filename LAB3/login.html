<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="wrapper">
        <header class="header-box">
            <div class="header-spacer"></div>
            <h1 class="header-text">인프밍 영화 정보 사이트입니다.</h1>
        </header>
        
        <nav class="nav-menu">
            <a href="index.html">메인페이지</a>
            <a href="login.html" class="active">로그인</a>
            <a href="signup.html">회원가입</a>
        </nav>

        <div class="form-container">
            <form>
                <div class="form-group">
                    <label class="title-label">아이디 :</label>
                    <input type="text" name="userid" placeholder="아이디 입력" required autofocus>
                </div>
                
                <div class="form-group">
                    <label class="title-label">비밀번호 :</label>
                    <input type="password" name="pwd" placeholder="비밀번호 입력" required>
                </div>
                
                <div class="btn-group">
                    <button type="submit" class="btn-submit">Login</button>
                    <button type="reset" class="btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
