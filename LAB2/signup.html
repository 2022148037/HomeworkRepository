<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <!-- 외부 CSS 참조 코드 -->
    <link rel="stylesheet" type="text/css" href="main.css">
</head>
<body>
    <h1>Welcome to INTERNET-PROGRAMMING MOVIE SITE</h1>
    
    <div class="header-links">
        <a href="login.html">로그인</a> | <a href="signup.html">회원가입</a>
    </div>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label class="title-label">이름 :</label>
                <!-- Input 1: text 타입 / autofocus, required 속성 사용 -->
                <input type="text" name="username" autofocus required>
            </div>
            
            <div class="form-group">
                <label class="title-label">생일 :</label>
                <!-- Input 2: date 타입 -->
                <input type="date" name="birthday">
            </div>
            
            <div class="form-group">
                <label class="title-label">성별 :</label>
                <!-- Input 3: radio 타입 사용 -->
                <input type="radio" id="male" name="gender" value="male"> 
                <label for="male" class="radio-label">남성</label>
                <input type="radio" id="female" name="gender" value="female"> 
                <label for="female" class="radio-label">여성</label>
            </div>
            
            <div class="form-group">
                <label class="title-label">학년 :</label>
                <!-- Input 4: number 타입 / step 속성 사용 -->
                <input type="number" name="grade" min="1" max="4" step="1">
            </div>
            
            <div class="form-group">
                <label class="title-label">아이디 :</label>
                <!-- placeholder 속성 사용 -->
                <input type="text" name="userid" placeholder="아이디 입력" required>
            </div>
            
            <div class="form-group">
                <label class="title-label">비밀번호 :</label>
                <!-- Input 5: password 타입 / placeholder 속성 사용 -->
                <input type="password" name="pwd" placeholder="비밀번호 입력" required>
            </div>
            
            <div class="form-group">
                <label class="title-label">이메일 :</label>
                <!-- Input 6: email 타입 / autocomplete 속성 사용 -->
                <input type="email" name="email" autocomplete="email">
            </div>
            
            <div class="form-group">
                <label class="title-label">보안 질문 :</label>
                <!-- Select (Dropdown) 사용 -->
                <select name="sec_question">
                    <option value="">질문을 선택하세요</option>
                    <option value="movie">가장 좋아하는 영화는?</option>
                    <option value="school">출신 초등학교는?</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="title-label">답변 :</label>
                <input type="text" name="sec_answer">
            </div>

            <div class="btn-group">
                <!-- Redirect 버튼: 클릭 시 login.html로 이동 -->
                <button type="button" class="btn-submit" onclick="location.href='login.html'">Signup</button>
                <button type="reset" class="btn-cancel">Cancel</button>
            </div>
        </form>
    </div>
</body>
</html>
